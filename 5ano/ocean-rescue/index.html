<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>OCEAN RESCUE · Unit 5 · 5º ano</title>
<style>
  :root{
    --bg:#eef7fb; --card:#ffffff; --ink:#12303d; --dim:#557483; --line:#cde3ee;
    --red:#c0483c; --orange:#e08a2b; --yellow:#f2c744; --green:#149a6e; --teal:#0e7f92;
    --blue:#1c7ea8; --deep:#0d5878; --purple:#6d4f8f; --pink:#d05a86; --sand:#f6e3bd;
    --ok:#1fbd7c; --bad:#ff5a5f;
    --r:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:
      radial-gradient(820px 460px at 88% -6%, rgba(28,126,168,.26), transparent 62%),
      radial-gradient(760px 460px at 2% 100%, rgba(20,154,110,.22), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Trebuchet MS",Verdana,"Segoe UI",system-ui,sans-serif;
    min-height:100vh;
  }
  ::-webkit-scrollbar{height:12px; width:12px;}
  ::-webkit-scrollbar-thumb{background:#9dc6d8; border-radius:99px;}
  svg.ico{width:1em; height:1em; vertical-align:-.12em;}

  /* ================= TOP BAR ================= */
  #bar{
    position:sticky; top:0; z-index:200; display:flex; align-items:center; gap:10px;
    padding:10px 16px; background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
    border-bottom:3px solid var(--line); flex-wrap:wrap;
  }
  #logo{font-weight:900; font-size:19px; letter-spacing:-.5px; cursor:pointer; white-space:nowrap; line-height:1.05;}
  #logo span{display:block; font-size:9.5px; letter-spacing:2.5px; color:var(--dim); font-weight:800;}
  .grow{flex:1;}
  .btn{
    border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink);
    font:inherit; font-weight:900; font-size:14px; padding:8px 14px; cursor:pointer;
    box-shadow:0 3px 0 var(--ink); transition:.1s; white-space:nowrap;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 5px 0 var(--ink);}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink);}
  .btn.y{background:var(--yellow);} .btn.g{background:var(--green); color:#fff;}
  .btn.b{background:var(--blue); color:#fff;} .btn.p{background:var(--purple); color:#fff;}
  .btn.r{background:var(--red); color:#fff;} .btn.on{background:var(--ink); color:var(--yellow);}
  .btn:disabled{opacity:.45; cursor:default; transform:none; box-shadow:0 3px 0 var(--ink);}
  .pill{
    display:flex; align-items:center; gap:6px; background:#fff; border:3px solid var(--ink);
    border-radius:99px; padding:5px 13px; font-weight:900; font-size:14px; white-space:nowrap;
  }
  #stars{color:var(--orange); letter-spacing:1px;}

  /* ================= HOME ================= */
  #hero{padding:34px 5vw 10px; max-width:1200px; margin:0 auto; text-align:center;}
  #hero .big{font-size:64px; line-height:1;}
  #hero h1{
    font-size:clamp(32px,6.5vw,62px); line-height:.98; letter-spacing:-1.5px; font-weight:900;
    margin:8px 0 6px;
  }
  #hero h1 em{font-style:normal; color:var(--blue);}
  #hero .sub{font-size:clamp(15px,2vw,20px); color:var(--dim); font-weight:800;}
  .tags{display:flex; justify-content:center; flex-wrap:wrap; gap:7px; margin:16px 0 6px;}
  .tag{background:#fff; border:2.5px solid var(--ink); border-radius:99px; padding:5px 13px;
    font-size:12.5px; font-weight:900;}
  main{max-width:1200px; margin:0 auto; padding:16px 5vw 90px;}
  .maptitle{display:flex; align-items:center; gap:10px; margin:26px 0 14px; font-size:15px;
    font-weight:900; letter-spacing:2px; color:var(--dim);}
  .maptitle::after{content:""; flex:1; height:3px; background:var(--line); border-radius:9px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:16px;}
  .st{
    background:var(--card); border:3px solid var(--ink); border-radius:var(--r);
    box-shadow:0 5px 0 var(--ink); padding:16px 14px; cursor:pointer; text-align:left;
    font:inherit; color:inherit; transition:.12s; position:relative; overflow:hidden;
  }
  .st:hover{transform:translateY(-4px); box-shadow:0 9px 0 var(--ink);}
  .st .no{position:absolute; top:0; right:0; background:var(--ink); color:#fff; font-size:11px;
    font-weight:900; padding:4px 10px; border-radius:0 0 0 12px;}
  .st .em{font-size:42px; line-height:1;}
  .st .nm{font-weight:900; font-size:17.5px; margin-top:8px; line-height:1.1;}
  .st .ds{font-size:12.5px; color:var(--dim); font-weight:700; margin-top:4px; line-height:1.35;}
  .st .bar{height:9px; background:#e4eff4; border:2px solid var(--ink); border-radius:99px; margin-top:11px; overflow:hidden;}
  .st .bar i{display:block; height:100%; background:var(--green); width:0%;}
  .st.done{background:#e7fbf2;}
  .st .chk{position:absolute; bottom:10px; right:12px; font-size:26px;}

  /* ================= PLAYER ================= */
  #play{display:none; max-width:1100px; margin:0 auto; padding:20px 5vw 120px;}
  #play.on{display:block;}
  h2.sec{font-size:clamp(24px,4vw,40px); font-weight:900; letter-spacing:-1px; line-height:1.05;}
  h2.sec .em{margin-right:8px;}
  p.tip{background:#fff; border:3px solid var(--ink); border-left-width:12px; border-radius:14px;
    padding:12px 16px; font-size:15.5px; font-weight:700; margin:14px 0 18px; line-height:1.5;}
  p.tip b{background:var(--yellow); padding:0 4px; border-radius:4px;}
  p.how{color:var(--dim); font-weight:800; font-size:15px; margin:6px 0 14px;}

  /* vocab cards */
  .vg{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:13px;}
  .vc{background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink);
    padding:14px 12px; text-align:center; cursor:pointer; min-height:140px;
    display:flex; flex-direction:column; justify-content:center; transition:.12s; position:relative;}
  .vc:hover{transform:translateY(-3px);}
  .vc.flip{background:var(--sand);}
  .vc .e{font-size:40px; line-height:1;}
  .vc .w{font-weight:900; font-size:20px; margin-top:6px;}
  .vc .tap{font-size:10.5px; color:var(--dim); font-weight:900; letter-spacing:1.5px; margin-top:5px;}
  .vc .bk{display:none;}
  .vc.flip .fr{display:none;} .vc.flip .bk{display:block;}
  .vc .pt{font-weight:900; font-size:19px;}
  .vc .ex{font-size:13px; font-weight:700; margin-top:7px; color:#6a5330;}

  .ex{background:#fff; border:3px solid var(--ink); border-radius:var(--r);
    box-shadow:0 4px 0 var(--ink); padding:15px 17px; margin-bottom:14px;}
  .qn{font-size:clamp(17px,2.1vw,22px); font-weight:900; line-height:1.4; margin-bottom:11px;}
  .qn .n{display:inline-grid; place-items:center; width:28px; height:28px; border-radius:9px;
    background:var(--blue); color:#fff; font-size:14px; margin-right:9px; vertical-align:2px;}
  .opts{display:grid; gap:9px;}
  .opts.two{grid-template-columns:1fr 1fr;}
  .opts.four{grid-template-columns:1fr 1fr;}
  @media(max-width:640px){.opts.two,.opts.four{grid-template-columns:1fr;}}
  .op{border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink);
    font:inherit; font-weight:900; font-size:17px; padding:12px 15px; cursor:pointer;
    text-align:left; box-shadow:0 3px 0 var(--ink); transition:.1s;}
  .op:hover:not(:disabled){transform:translateY(-2px); background:#f4fbff;}
  .op.right{background:#c9f5dd; border-color:var(--ok);}
  .op.wrong{background:#ffd9da; border-color:var(--bad); opacity:.8;}
  .fb{font-weight:900; font-size:15.5px; margin-top:10px;}
  .fb .wy{display:block; font-weight:700; color:var(--dim); font-size:14px; margin-top:3px;}

  /* quadro ENTENDA O ERRO */
  .oops{margin-top:12px; background:#fff6e9; border:3px solid var(--orange); border-radius:14px; padding:12px 15px;}
  .oops .t{font-size:11.5px; letter-spacing:2px; font-weight:900; color:var(--orange); margin-bottom:9px;}
  .oops .cmp{display:grid; gap:6px; margin-bottom:9px;}
  .oops .x{background:#ffe6e6; border-left:5px solid var(--bad); padding:6px 10px; border-radius:9px; font-size:15px; font-weight:800;}
  .oops .v{background:#e2fbef; border-left:5px solid var(--ok); padding:6px 10px; border-radius:9px; font-size:15px; font-weight:800;}
  .oops .pq{font-size:15px; line-height:1.5; font-weight:700; color:#4a3a20;}
  .oops .rg{margin-top:8px; font-size:14.5px; font-weight:800; color:var(--deep); background:#e8f4f9; padding:7px 11px; border-radius:9px;}

  /* chips */
  .slot{min-height:58px; border:3px dashed var(--dim); border-radius:14px; background:#f9fdff;
    padding:8px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:10px;}
  .slot.ok{border-style:solid; border-color:var(--ok); background:#e9fbf2;}
  .slot.no{border-style:solid; border-color:var(--bad); background:#fff0f0;}
  .bank{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:9px;}
  .ch{border:3px solid var(--ink); border-radius:12px; background:#9fd6ea; color:var(--ink);
    font:inherit; font-weight:900; font-size:19px; padding:9px 14px; cursor:pointer;
    box-shadow:0 3px 0 var(--ink);}
  .ch:hover{transform:translateY(-2px);}
  .ch.used{opacity:.2; pointer-events:none;}
  .ch.let{background:var(--pink); color:#fff; min-width:46px; text-align:center; font-size:22px;}
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .hint{font-size:15px; font-weight:800; color:var(--dim);}

  /* sort */
  .srow{background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink);
    padding:11px 14px; margin-bottom:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .srow .it{font-weight:900; font-size:19px; min-width:200px; flex:1;}
  .sb{border:3px solid var(--ink); border-radius:12px; background:#fff; font:inherit;
    font-weight:900; font-size:14.5px; padding:8px 13px; cursor:pointer; box-shadow:0 3px 0 var(--ink);}
  .sb:hover:not(:disabled){background:#f4fbff;}
  .sb.right{background:#c9f5dd; border-color:var(--ok);}
  .sb.wrong{background:#ffd9da; border-color:var(--bad); opacity:.8;}

  /* match */
  .mg{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:640px){.mg{grid-template-columns:1fr;}}
  .mh{font-size:11.5px; letter-spacing:2px; font-weight:900; color:var(--dim); margin-bottom:8px;}
  .mi{display:block; width:100%; text-align:left; border:3px solid var(--ink); border-radius:14px;
    background:#fff; color:var(--ink); font:inherit; font-weight:900; font-size:16.5px;
    padding:11px 14px; margin-bottom:9px; cursor:pointer; box-shadow:0 3px 0 var(--ink);}
  .mi:hover:not(:disabled){background:#f4fbff;}
  .mi.sel{background:var(--yellow);}
  .mi.got{background:#c9f5dd; border-color:var(--ok); cursor:default; box-shadow:none;}
  .mi.err{background:#ffd9da; animation:shk .3s;}
  @keyframes shk{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  /* reading */
  .read{background:#fffdf6; border:3px solid var(--ink); border-radius:var(--r); box-shadow:0 5px 0 var(--ink);
    padding:20px 22px; margin-bottom:18px; font-size:18px; line-height:1.68; font-weight:600;}
  .read h3{font-size:23px; font-weight:900; margin-bottom:10px; color:var(--blue);}
  .read p{margin-bottom:10px;}
  .read .gl{margin-top:14px; font-size:14px; font-weight:800; color:#5b4a2a;
    background:var(--yellow); border-radius:12px; padding:9px 13px;}
  .poster{border:4px solid var(--deep); border-radius:16px; background:#e9f6fb; padding:16px 18px; margin-top:6px;}
  .poster.alt{background:#fff4e2; border-color:var(--orange); margin-top:12px;}
  .poster .ph{font-size:22px; font-weight:900; letter-spacing:1px; text-align:center;
    color:var(--deep); margin-bottom:12px;}
  .poster.alt .ph{color:var(--orange);}
  .poster .pr{display:flex; gap:12px; justify-content:space-between; border-bottom:2px dotted #bcd6e2;
    padding:6px 0; font-size:16.5px;}
  .poster .pr b{color:var(--red);}

  /* grammar lab */
  .lab{background:#fff; border:3px solid var(--ink); border-radius:var(--r); box-shadow:0 5px 0 var(--ink);
    padding:18px 20px; margin-bottom:18px;}
  .lab h3{font-size:clamp(19px,2.2vw,25px); font-weight:900; letter-spacing:-.4px; margin-bottom:14px;}
  .labrow{border-top:2px dashed var(--line); padding:13px 0;}
  .labrow:first-of-type{border-top:0; padding-top:2px;}
  .labrow .fm{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:7px;}
  .labrow .fm b{font-size:16px; background:var(--ink); color:#fff; padding:3px 11px; border-radius:99px;}
  .labrow .fm code{font-family:Consolas,monospace; font-size:15.5px; color:var(--teal); font-weight:700;}
  .labrow .en, .labrow .ptx{font-size:16px; line-height:1.5; padding:7px 12px; border-radius:10px; margin-bottom:6px;}
  .labrow .en{background:#e9f4f7; border-left:5px solid var(--teal);}
  .labrow .ptx{background:#fdf1e2; border-left:5px solid var(--orange);}
  .labrow .en::before{content:"EN  "; font-weight:900; font-size:11px; letter-spacing:1.5px; color:var(--teal);}
  .labrow .ptx::before{content:"PT  "; font-weight:900; font-size:11px; letter-spacing:1.5px; color:var(--orange);}
  .labrow .exm{font-size:16.5px; font-weight:800; margin-top:6px; color:var(--green);}
  .labrow .exm::before{content:"\25B8  ";}
  .cerr{margin-top:16px; background:#fdecea; border:3px solid var(--red); border-radius:14px; padding:13px 16px;}
  .cerr .t{font-size:11.5px; letter-spacing:2px; font-weight:900; color:var(--red); margin-bottom:8px;}
  .cerr .w{font-size:17px; font-weight:800; text-decoration:line-through; color:var(--red); margin-bottom:4px;}
  .cerr .r{font-size:17px; font-weight:900; color:var(--green); margin-bottom:7px;}
  .cerr .n{font-size:15px; line-height:1.5; color:#4a3020;}

  /* ===== CROSSWORD ===== */
  .cwwrap{display:grid; grid-template-columns:minmax(280px,auto) 1fr; gap:20px; align-items:start;}
  @media(max-width:820px){.cwwrap{grid-template-columns:1fr;}}
  .cwgrid{display:grid; gap:2px; background:var(--ink); padding:3px; border-radius:10px; width:max-content;
    border:3px solid var(--ink);}
  .cwcell{width:34px; height:34px; position:relative; background:#0d3141;}
  .cwcell.open{background:#fff;}
  .cwcell input{width:100%; height:100%; border:0; background:transparent; text-align:center;
    font:inherit; font-weight:900; font-size:19px; text-transform:uppercase; color:var(--ink); padding:0;}
  .cwcell input:focus{outline:0; background:var(--yellow);}
  .cwcell.hi input{background:#dff0f8;}
  .cwcell.hi input:focus{background:var(--yellow);}
  .cwcell.good input{background:#c9f5dd; color:#0a5b3b;}
  .cwcell.bad input{background:#ffd9da;}
  .cwcell .cn{position:absolute; top:0; left:2px; font-size:9.5px; font-weight:900; color:var(--dim); line-height:1;}
  .cwclues{display:grid; gap:16px;}
  .cwclues h4{font-size:12px; letter-spacing:2px; color:var(--dim); margin-bottom:7px;}
  .cwclue{border:3px solid var(--line); border-radius:12px; background:#fff; padding:8px 12px;
    margin-bottom:7px; font-size:15px; font-weight:700; cursor:pointer; line-height:1.4;}
  .cwclue:hover{border-color:var(--blue);}
  .cwclue.sel{border-color:var(--blue); background:#eaf6fb;}
  .cwclue.got{background:#e7fbf2; border-color:var(--ok);}
  .cwclue b{color:var(--blue); margin-right:6px;}
  body.proj .cwcell{width:46px; height:46px;}
  body.proj .cwcell input{font-size:26px;}
  @media(max-width:560px){ .cwcell{width:27px; height:27px;} .cwcell input{font-size:15px;} }

  /* ===== SAVE THE TURTLE ===== */
  .tgwrap{display:grid; grid-template-columns:300px 1fr; gap:20px; align-items:start;}
  @media(max-width:760px){.tgwrap{grid-template-columns:1fr;}}
  .sea{position:relative; height:230px; border:3px solid var(--ink); border-radius:18px; overflow:hidden;
    background:linear-gradient(#bfe8f7,#5fb6d8 55%,#2e86ad); box-shadow:0 5px 0 var(--ink);}
  .sea .turtle{position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); font-size:62px;
    transition:.3s; z-index:2;}
  .sea .junk{position:absolute; font-size:26px; opacity:0; transition:.4s; z-index:3;}
  .sea .junk.on{opacity:1;}
  .sea .sky{position:absolute; inset:0 0 auto 0; height:26%; background:#dff3fb;}
  .sea .sand{position:absolute; left:0; right:0; bottom:0; height:20%; background:#f0dcae;}
  .sea .msg{position:absolute; left:0; right:0; bottom:6px; text-align:center; font-weight:900;
    font-size:14px; color:#0b3346; z-index:4;}
  .lives{display:flex; gap:5px; justify-content:center; margin-top:10px; font-size:22px;}
  .word{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin:14px 0;}
  .wl{width:36px; height:46px; border-bottom:5px solid var(--ink); font-size:28px; font-weight:900;
    display:grid; place-items:center; color:var(--deep);}
  .wl.sp{border:0; width:16px;}
  .keys{display:grid; grid-template-columns:repeat(auto-fit,minmax(42px,1fr)); gap:6px;}
  .ky{border:3px solid var(--ink); border-radius:10px; background:#fff; font:inherit; font-weight:900;
    font-size:18px; padding:9px 0; cursor:pointer; box-shadow:0 3px 0 var(--ink);}
  .ky:hover:not(:disabled){background:#f4fbff;}
  .ky.hit{background:#c9f5dd; border-color:var(--ok);}
  .ky.miss{background:#ffd9da; border-color:var(--bad); opacity:.55;}
  .ky:disabled{cursor:default; transform:none;}
  body.proj .wl{width:46px; height:58px; font-size:36px;}

  /* ===== WRITING ===== */
  .wbox input.tx{width:100%; border:3px solid var(--ink); border-radius:12px; font:inherit;
    font-weight:800; font-size:18px; padding:11px 14px; background:#fdfffe;}
  .wbox input.tx:focus{outline:0; border-color:var(--blue); background:#f2fbff;}
  .wbox input.tx.good{background:#c9f5dd; border-color:var(--ok);}
  .wbox input.tx.bad{background:#ffe9ea; border-color:var(--bad);}
  .wskel{font-family:Consolas,monospace; font-size:14.5px; color:var(--dim); font-weight:700; margin-bottom:9px;}

  /* ===== SPEAKING ===== */
  .spcard{background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink);
    padding:16px 18px; margin-bottom:13px;}
  .spcard .en{font-size:clamp(19px,2.4vw,26px); font-weight:900; line-height:1.3;}
  .spcard .pt{font-size:15px; font-weight:700; color:var(--dim); margin-top:4px;}
  .spcard .heard{margin-top:10px; font-size:15.5px; font-weight:800; background:#eef6fa;
    border-radius:10px; padding:8px 12px; min-height:38px;}
  .spcard .heard b{color:var(--green);}
  .mic{width:60px; height:60px; border-radius:50%; border:3px solid var(--ink); background:var(--red);
    color:#fff; font-size:26px; cursor:pointer; box-shadow:0 4px 0 var(--ink); line-height:1;}
  .mic:hover{transform:translateY(-2px);}
  .mic.rec{background:var(--green); animation:pulse 1s infinite;}
  @keyframes pulse{50%{transform:scale(1.08);}}
  .score{font-size:22px; letter-spacing:2px;}
  #micwarn{background:#fff6e9; border:3px solid var(--orange); border-radius:14px; padding:11px 15px;
    font-size:14.5px; font-weight:800; margin-bottom:14px; line-height:1.5;}

  /* ===== LISTENING ===== */
  .lncard{background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink);
    padding:16px 18px; margin-bottom:13px;}
  .lncard .ctl{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:11px;}
  .lncard .qq{font-weight:900; font-size:18px; margin-bottom:10px;}
  .lncard .txt{display:none; margin-top:10px; font-size:16px; font-weight:800; color:var(--deep);
    background:#eef6fa; border-radius:10px; padding:8px 12px;}
  .lncard.shown .txt{display:block;}

  /* ===== POSTER BUILDER ===== */
  .pbwrap{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start;}
  @media(max-width:860px){.pbwrap{grid-template-columns:1fr;}}
  .pf{margin-bottom:12px;}
  .pf label{display:block; font-weight:900; font-size:14px; margin-bottom:4px;}
  .pf .hp{font-size:12.5px; color:var(--dim); font-weight:700; margin-bottom:5px;}
  .pf input, .pf textarea{width:100%; border:3px solid var(--ink); border-radius:12px; font:inherit;
    font-weight:800; font-size:16px; padding:9px 12px; background:#fdfffe;}

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");

function addStars(n){
  stars += n;

function bump(){
  hits++;

  prog[cur] = Math.max(prog[cur]||0, pc);
  if(pc>=100 && !done[cur]){
    done[cur]=true; addStars(STATIONS[cur].stars);
    toast("🎉 " + STATIONS[cur].n + " · +" + STATIONS[cur].stars + " ⭐");

}

/* ---------------- voz ---------------- */
const TTS = (typeof window.speechSynthesis !== "undefined" &&
             typeof window.SpeechSynthesisUtterance !== "undefined");
let _voice = null;
function pickVoice(){
  if(!TTS) return null;
  if(_voice) return _voice;
  let vs = []; try{ vs = window.speechSynthesis.getVoices() || []; }catch(e){}
  const pref = ["en-US","en_US","en-GB","en_GB","en"];
  for(const p of pref) for(const v of vs) if(v.lang && v.lang.indexOf(p)===0){ _voice=v; return _voice; }
  return null;
}
if(TTS){ try{ window.speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }catch(e){} }
function say(txt, slow, btn){
  if(!TTS || !txt) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const u = new window.SpeechSynthesisUtterance(String(txt).replace(/<[^>]+>/g,"").replace(/[“”"]/g,""));
  const v = pickVoice(); if(v) u.voice = v;
  u.lang = (v && v.lang) || "en-US";
  u.rate = slow ? 0.62 : 0.9;
  if(btn){ btn.classList.add("rec"); u.onend = u.onerror = () => btn.classList.remove("rec"); }
  try{ window.speechSynthesis.speak(u); }catch(e){}
}
function stopSay(){ if(TTS){ try{ window.speechSynthesis.cancel(); }catch(e){} } }

/* ---------------- CROSSWORD ---------------- */
function buildCross(def){
  const cells = {};                       /* "r,c" -> {sol, wi:[índices]} */
  const words = def.words.map((w,i)=>({...w, i, cells:[], num:0, ok:false}));
  words.forEach(w=>{
    for(let n=0;n<w.w.length;n++){
      const r = w.dir==="a" ? w.r : w.r+n;
      const c = w.dir==="a" ? w.c+n : w.c;
      const id = r+","+c;
      if(!cells[id]) cells[id] = {r, c, sol:w.w[n], wi:[]};
      cells[id].wi.push(w.i);
      w.cells.push(id);
    }
  });
  /* numeração padrão: varre linha a linha e numera quem começa palavra */
  const starts = {};
  words.forEach(w=> starts[w.r+","+w.c] = true);
  let n=0;
  Object.keys(cells).map(k=>cells[k]).sort((a,b)=> a.r-b.r || a.c-b.c).forEach(cl=>{
    if(starts[cl.r+","+cl.c]){ n++; cl.num = n; }
  });
  words.forEach(w=>{ w.num = cells[w.r+","+w.c].num; });
  return {def, cells, words, sel:0};
}
function crossHTML(){
  const d=CW.def, rows=d.rows, cols=d.cols;
  let g = `<div style="overflow:auto"><div class="cwgrid" style="grid-template-columns:repeat(${cols},auto)">`;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const cl = CW.cells[r+","+c];
    if(!cl){ g += `<div class="cwcell"></div>`; continue; }
    g += `<div class="cwcell open" id="cc-${r}-${c}">
        ${cl.num?`<span class="cn">${cl.num}</span>`:""}
        <input maxlength="1" id="ci-${r}-${c}" inputmode="text" autocomplete="off"
          onfocus="cwFocus(${r},${c})" oninput="cwType(${r},${c})" onkeydown="cwKey(event,${r},${c})">
      </div>`;
  }
  g += `</div></div>`;
  const list = dir => CW.words.filter(w=>w.dir===dir).sort((a,b)=>a.num-b.num).map(w=>`
    <div class="cwclue" id="cq-${w.i}" onclick="cwSelect(${w.i})">
      <b>${w.num}.</b>${w.clue}
      <button class="btn b" style="font-size:11px;padding:3px 8px;margin-left:6px"
        onclick="event.stopPropagation();say(CW.words[${w.i}].clue,false,this)">🔊</button>
    </div>`).join("");
  return `<div class="cwwrap">
    ${g}
    <div class="cwclues">
      <div><h4>➡️ ACROSS</h4>${list("a")}</div>
      <div><h4>⬇️ DOWN</h4>${list("d")}</div>
      <div class="row">
        <button class="btn g" onclick="cwCheck()">✔ Check</button>
        <button class="btn y" onclick="cwReveal()">👀 Answers</button>
      </div>
    </div></div>`;
}
function cwSelect(i){
  if(!CW || !CW.words[i] || !$("cq-"+i)) return;   /* já saiu da estação */
  CW.sel = i;
  CW.words.forEach(w=>{ const e=$("cq-"+w.i); if(e) e.classList.toggle("sel", w.i===i); });
  Object.keys(CW.cells).forEach(k=>{
    const cl=CW.cells[k], e=$("cc-"+cl.r+"-"+cl.c);
    if(e) e.classList.toggle("hi", cl.wi.indexOf(i)>=0);
  });
  const w=CW.words[i], first=w.cells.find(k=>!$("ci-"+k.replace(",","-")).value) || w.cells[0];
  const el=$("ci-"+first.replace(",","-")); if(el) el.focus();
}
function cwFocus(r,c){
  const cl=CW.cells[r+","+c]; if(!cl) return;
  if(cl.wi.indexOf(CW.sel)<0) cwSelect(cl.wi[0]);
}
function cwStep(r,c,d){
  const w=CW.words[CW.sel]; if(!w) return;
  const nr = w.dir==="a" ? r : r+d, nc = w.dir==="a" ? c+d : c;
  const el=$("ci-"+nr+"-"+nc); if(el) el.focus();
}
function cwType(r,c){
  const el=$("ci-"+r+"-"+c);
  el.value = (el.value||"").toUpperCase().replace(/[^A-Z]/g,"");
  $("cc-"+r+"-"+c).classList.remove("good","bad");
  if(el.value) cwStep(r,c,1);
  cwWordCheck();
}
function cwKey(e,r,c){
  if(e.key==="Backspace" && !$("ci-"+r+"-"+c).value){ cwStep(r,c,-1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); const el=$("ci-"+r+"-"+(c+1)); if(el) el.focus(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); const el=$("ci-"+r+"-"+(c-1)); if(el) el.focus(); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); const el=$("ci-"+(r+1)+"-"+c); if(el) el.focus(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); const el=$("ci-"+(r-1)+"-"+c); if(el) el.focus(); }
}
function cwWordCheck(){
  CW.words.forEach(w=>{
    if(w.ok) return;
    const got = w.cells.map(k=>($("ci-"+k.replace(",","-")).value||"")).join("");
    if(got===w.w){
      w.ok=true;
      $("cq-"+w.i).classList.add("got");
      w.cells.forEach(k=>$("cc-"+k.replace(",","-")).classList.add("good"));
      say(w.w); bump();
    }
  });
}
function cwCheck(){
  CW.words.forEach(w=>{
    if(w.ok) return;
    w.cells.forEach(k=>{
      const el=$("ci-"+k.replace(",","-")), box=$("cc-"+k.replace(",","-"));
      if(!el.value) return;
      box.classList.toggle("bad", el.value!==CW.cells[k].sol);
    });
  });

/* ---------------- speaking (microfone) ---------------- */
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const MIC_OK = !!SRC;
let rec = null, recIdx = -1;
function stopMic(){ if(rec){ try{ rec.abort(); }catch(e){} rec=null; recIdx=-1; } }
function micGo(i){
  if(!MIC_OK) return;
  if(recIdx===i){ stopMic(); $("mc-"+i).classList.remove("rec"); return; }
  stopMic(); stopSay();
  try{ rec = new SRC(); }catch(e){ $("sh-"+i).textContent="Não deu para abrir o microfone."; return; }
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=5;
  recIdx=i;
  const btn=$("mc-"+i); btn.classList.add("rec");
  $("sh-"+i).innerHTML="🎙️ Escutando… fale agora!";
  rec.onresult = e => {
    const alts=[]; for(let k=0;k<e.results[0].length;k++) alts.push(e.results[0][k].transcript);
    spJudge(i, alts);
  };
  rec.onerror = e => {
    $("sh-"+i).innerHTML = e.error==="not-allowed"
      ? "🚫 O microfone está bloqueado. Toque no cadeado da barra do navegador e permita o microfone — ou use ✅ Eu consegui."
      : "Não escutei nada. Tente de novo, mais perto do aparelho.";
  };
  rec.onend = () => { btn.classList.remove("rec"); if(recIdx===i){ rec=null; recIdx=-1; } };
  try{ rec.start(); }catch(e){ btn.classList.remove("rec"); }
}
function words(s){ return norm(s).split(" ").filter(Boolean); }
function spScore(alvo, dito){
  const A=words(alvo), D=words(dito);
  if(!A.length) return 0;
  const pool=[...D];
  let hit=0;
  A.forEach(w=>{ const k=pool.indexOf(w); if(k>=0){ hit++; pool.splice(k,1); } });
  return hit/A.length;
}
function spJudge(i, alts){
  const it=SP.set.items[i];
  let best=0, bestTxt=alts[0]||"";
  alts.forEach(a=>{ const s=spScore(it.en,a); if(s>best){ best=s; bestTxt=a; } });
  const pct=Math.round(best*100);
  const stars5 = best>=.95?"⭐⭐⭐" : best>=.7?"⭐⭐" : best>=.45?"⭐" : "";
  $("ss-"+i).textContent = stars5;
  $("sh-"+i).innerHTML = `Eu ouvi: <b>“${esc(bestTxt)}”</b> · ${pct}% das palavras`
    + (best>=.7 ? " · 👏 muito bom!" : " · tente de novo, mais devagar 🐢");
  if(best>=.7 && !SP.ok[i]){ SP.ok[i]=true; bump(); }
}
function spDone(i){
  if(SP.ok[i]) return;
  SP.ok[i]=true; $("ss-"+i).textContent="✅";
  $("sh-"+i).innerHTML="Marcado como feito. Continue treinando em voz alta!";
  bump();
}

  if(s.kind==="listen"){
    LN.items.forEach((it,i)=>{ const c=$("ln-"+i); c.classList.add("shown");
      const ops=c.querySelectorAll(".op"); ops[it.a].classList.add("right"); ops.forEach(o=>o.disabled=true); });
    return;
  }
  if(s.kind==="sort"){
    SO.items.forEach((it,i)=>{ const r=document.querySelector('.srow[data-i="'+i+'"]');
      const bs=r.querySelectorAll(".sb"); bs[it.c].classList.add("right"); bs.forEach(b=>b.disabled=true); });
    return;
  }
  if(s.kind==="quiz"){
    tList().forEach(o=>{ if(qA[o.i]===undefined) qA[o.i]=FINALE[o.i].a; });
    qRender(); return;
  }
  const ns = s.kind==="read" ? READS[s.set].set : s.set;
  if(QS[ns]){
    QS[ns].items.forEach((it,i)=>{
      const fb=$("mf-"+ns+"-"+i); if(!fb) return;
      const el=fb.closest(".ex"); if(!el || el.dataset.ok) return;
      const ops=el.querySelectorAll(".op");
      ops[it.a].classList.add("right"); ops.forEach(o=>o.disabled=true);
      fb.innerHTML='<span style="color:var(--dim)">👀 resposta</span>';
    });
    return;
  }
  toast("Esta estação não tem gabarito para mostrar 🙂");
}

/* ---------------- equipes e projeção ---------------- */
function drawTeams(){

}
function tp(i,v){ teams[i].p=Math.max(0,teams[i].p+v); drawTeams(); }

/* =========================================================================
   MELHORIAS · progresso salvo · pronúncia · rever meus erros
   Cole este bloco no FIM do <script> de cada jogo. Ele detecta sozinho qual
   motor o jogo usa e desliga o que não se aplica. Não altera nada do resto.
   ========================================================================= */
(function(){
if (window.__melhorias) return;   /* já aplicado */

/* ---------- 1. qual motor é este? ---------- */
var DIA = null;
try { if (typeof STATIONS !== "undefined" && typeof prog !== "undefined" && typeof stars !== "undefined") DIA = "A"; } catch(e){}
if (!DIA) { try { if (typeof EPS !== "undefined" && typeof xp !== "undefined") DIA = "B"; } catch(e){} }
if (!DIA) { try { if (typeof EPS !== "undefined" && typeof pts !== "undefined") DIA = "C"; } catch(e){} }

var CFG = {
  A: { foot:"foot",  body:"body",  home:"homeView", wSel:".fr .w, .front .w", exSel:".bk .ex, .back .ex" },
  B: { foot:"pfoot", body:"pbody", home:"home",     wSel:".front .w",         exSel:".back .ex" },
  C: { foot:"pfoot", body:"pbody", home:"home",     wSel:".front .w",         exSel:".back .ex" }
}[DIA] || { foot:null, body:null, home:null, wSel:".front .w, .fr .w", exSel:".back .ex, .bk .ex" };

var $$ = function(id){ return document.getElementById(id); };
var bodyEl = function(){ return CFG.body ? $$(CFG.body) : null; };
var scope  = function(){ return bodyEl() || document; };

/* ---------- 2. estado, de forma independente do motor ---------- */
function ler(){
  try {
    if (DIA === "A") return { s: stars, d: done,    p: prog     };
    if (DIA === "B") return { s: xp,    d: doneEp,  p: progress };
    if (DIA === "C") return { s: pts,   d: doneEp,  p: progress };
  } catch(e){}
  return null;
}
function atual(){
  try {
    if (DIA === "A") return cur;
    if (DIA === "B" || DIA === "C") return curEp;
  } catch(e){}
  return null;
}
function aplicar(o){
  var t = ler(); if (!t) return;
  Object.keys(o.d || {}).forEach(function(k){ t.d[k] = o.d[k]; });
  Object.keys(o.p || {}).forEach(function(k){ t.p[k] = o.p[k]; });
  try {
    if (DIA === "A") { stars = 0; addStars(o.s || 0); drawMap(); }
    if (DIA === "B") { xp    = 0; addXp(o.s || 0);    drawRows(); }
    if (DIA === "C") { pts   = 0; addPts(o.s || 0);   drawRows(); }
  } catch(e){}
}

/* ---------- 3. gravação no aparelho do aluno ---------- */
var CHAVE = "english-linus:" + (location.pathname || "jogo").replace(/[^a-z0-9]/gi, "_") + ":v1";
var podeGravar = (function(){
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
})();

function gravar(){
  if (!podeGravar || !DIA) return;
  var t = ler(); if (!t) return;
  try {
    localStorage.setItem(CHAVE, JSON.stringify({
      s: t.s, d: t.d, p: t.p, erros: serializaErros(),
      quando: Date.now(), estacao: atual()
    }));
    piscaSalvo();
  } catch(e){}
}
function lido(){
  if (!podeGravar) return null;
  try { return JSON.parse(localStorage.getItem(CHAVE) || "null"); } catch(e){ return null; }
}
function apagar(){ try { localStorage.removeItem(CHAVE); } catch(e){} }

/* ---------- 4. registro dos erros ---------- */
var ERROS = {};                                  /* { estacao: { chave: true } } */
function marcaErro(est, chave){
  if (!est) return;
  (ERROS[est] = ERROS[est] || {})[chave] = true;
  atualizaBotaoErros();
}
function limpaErro(est, chave){
  if (est && ERROS[est]) { delete ERROS[est][chave]; atualizaBotaoErros(); }
}
function serializaErros(){ return ERROS; }
function contaErros(est){ return est && ERROS[est] ? Object.keys(ERROS[est]).length : 0; }

/* ---------- 5. embrulha as funções do motor ---------- */
function embrulha(nome, antes, depois){
  try {
    var f = eval(nome);
    if (typeof f !== "function") return false;
    window["__orig_" + nome] = f;
    var novo = function(){
      var args = arguments;
      if (antes) { try { antes.apply(null, args); } catch(e){} }
      var r = window["__orig_" + nome].apply(this, args);
      if (depois) { try { depois.apply(null, args); } catch(e){} }
      return r;
    };
    window.__novo = novo;
    eval(nome + " = window.__novo");
    delete window.__novo;
    return true;
  } catch(e){ return false; }
}

/* grava sempre que a pontuação ou o progresso mudam — os motores usam nomes
   diferentes, então embrulhamos todos os candidatos que existirem */
["bump", "addStars", "addXp", "addPts", "setProgress"].forEach(function(n){
  embrulha(n, null, function(){ gravar(); });
});

/* múltipla escolha: ansMcq(ns,i,j) · ans(ns,i,j) · pickAns(i,j,a) */
function itemQS(ns, i){
  var it = null;
  try { it = QS[ns].items[i]; } catch(e){}
  if (!it) { try { it = QS[ns][i]; } catch(e){} }
  return it || null;
}
function registra(ns, i, j){
  var it = itemQS(ns, i);
  if (!it) return;
  var k = ns + "#" + i;
  if (j === it.a) limpaErro(atual(), k); else marcaErro(atual(), k);
}
embrulha("ansMcq", null, function(ns, i, j){ registra(ns, i, j); });
embrulha("ans",    null, function(ns, i, j){ registra(ns, i, j); });
embrulha("pickAns", null, function(i, j, a){
  var k = "q#" + i;
  if (j === a) limpaErro(atual(), k); else marcaErro(atual(), k);
});

/* cestos: pickSort(i,j) · sortPick(i,j) */
embrulha("pickSort", null, function(i, j){
  var c = null;
  try { c = (typeof SO !== "undefined" && SO) ? SO.items[i].c : SORT.items[i].c; } catch(e){}
  if (c === null || c === undefined) { try { c = SORT[i].c; } catch(e){} }
  if (c === null || c === undefined) return;
  var k = "sort#" + i;
  if (j === c) limpaErro(atual(), k); else marcaErro(atual(), k);
});
embrulha("sortPick", null, function(i, j){
  var c = null;
  try { c = SORT[i].c; } catch(e){}
  if (c === null || c === undefined) return;
  var k = "sort#" + i;
  if (j === c) limpaErro(atual(), k); else marcaErro(atual(), k);
});

/* quiz final: qPick(gi,j) */
embrulha("qPick", null, function(gi, j){
  var q = null; try { q = FINALE[gi]; } catch(e){}
  if (!q) return;
  var k = "quiz#" + gi;
  if (j === q.a) limpaErro(atual(), k); else marcaErro(atual(), k);
});

/* toda vez que abre uma estação: põe os alto-falantes e ajusta o botão */
embrulha("openEp", null, function(){
  pararFala();
  poeAudio();
  atualizaBotaoErros();
});

/* ---------- 6. pronúncia com a voz do navegador ---------- */
var TEM_FALA = (typeof window.speechSynthesis !== "undefined" &&
                typeof window.SpeechSynthesisUtterance !== "undefined");
var vozEN = null;
function achaVoz(){
  if (!TEM_FALA) return null;
  if (vozEN) return vozEN;
  var vs = [];
  try { vs = window.speechSynthesis.getVoices() || []; } catch(e){}
  var pref = ["en-US", "en_US", "en-GB", "en_GB", "en"];
  for (var p = 0; p < pref.length; p++)
    for (var i = 0; i < vs.length; i++)
      if (vs[i].lang && vs[i].lang.indexOf(pref[p]) === 0) { vozEN = vs[i]; return vozEN; }
  return null;
}
if (TEM_FALA) { try { window.speechSynthesis.onvoiceschanged = achaVoz; achaVoz(); } catch(e){} }

function pararFala(){ if (TEM_FALA) { try { window.speechSynthesis.cancel(); } catch(e){} } }

function fala(txt, devagar, botao){
  if (!TEM_FALA || !txt) return;
  pararFala();
  var u = new window.SpeechSynthesisUtterance(String(txt).replace(/[“”"]/g, ""));
  var v = achaVoz(); if (v) u.voice = v;
  u.lang = (v && v.lang) || "en-US";
  u.rate = devagar ? 0.7 : 0.92;
  if (botao) {
    botao.classList.add("mlFalando");
    u.onend = u.onerror = function(){ botao.classList.remove("mlFalando"); };
  }
  try { window.speechSynthesis.speak(u); } catch(e){}
}

function textoProprio(el){
  var t = "";
  for (var i = 0; i < el.childNodes.length; i++) {
    var n = el.childNodes[i];
    if (n.nodeType === 3) t += n.nodeValue;                       /* nó de texto */
    else if (n.nodeType === 1 && !/^(SPAN|DIV|P)$/.test(n.tagName)) t += n.textContent;
    else if (n.nodeType === 1 && n.className &&
             /\b(b|i|em|strong)\b/i.test(n.tagName)) t += n.textContent;
  }
  return t.replace(/\s+/g, " ").trim();
}
function botaoAudio(txt, titulo, devagar){
  var b = document.createElement("button");
  b.type = "button";
  b.className = "mlSpk";
  b.innerHTML = devagar ? "🐢" : "🔊";
  b.title = titulo || "Ouvir em inglês";
  b.setAttribute("aria-label", b.title);
  b.addEventListener("click", function(ev){
    ev.stopPropagation(); ev.preventDefault();
    fala(txt, devagar, b);
  });
  return b;
}

function poeAudio(){
  if (!TEM_FALA) return;
  var raiz = scope();

  /* cartas de vocabulário: palavra (normal + devagar) e frase de exemplo */
  raiz.querySelectorAll(".vc").forEach(function(c){
    if (c.dataset.mlAudio) return; c.dataset.mlAudio = "1";
    var w = c.querySelector(CFG.wSel);
    if (w && w.textContent.trim()) {
      var cx = document.createElement("span");
      cx.className = "mlSpkBox";
      cx.appendChild(botaoAudio(w.textContent.trim(), "Ouvir a palavra"));
      cx.appendChild(botaoAudio(w.textContent.trim(), "Ouvir bem devagar", true));
      w.appendChild(cx);
    }
    var ex = c.querySelector(CFG.exSel);
    if (ex && ex.textContent.trim())
      ex.appendChild(botaoAudio(ex.textContent.trim(), "Ouvir a frase"));
  });

  /* cartas de fala rápida */
  raiz.querySelectorAll(".dc").forEach(function(c){
    if (c.dataset.mlAudio) return; c.dataset.mlAudio = "1";
    var s = c.querySelector(".say");
    if (s && s.textContent.trim())
      s.appendChild(botaoAudio(s.textContent.trim(), "Ouvir a frase"));
  });

  /* deck de projeção (English Rewind): só nos trechos que são inglês */
  if (!DIA && document.querySelectorAll("section.slide").length > 5) {
    /* frases completas em inglês */
    raiz.querySelectorAll("span.ans, div.q").forEach(function(el){
      if (el.dataset.mlAudio) return; el.dataset.mlAudio = "1";
      var t = textoProprio(el);
      if (t.length > 3) el.appendChild(botaoAudio(t, "Ouvir em inglês"));
    });
    /* .scr tem dois tipos: frase com lacuna (serve) e palavras embaralhadas (não serve) */
    raiz.querySelectorAll("span.scr").forEach(function(el){
      if (el.dataset.mlAudio) return; el.dataset.mlAudio = "1";
      var t = textoProprio(el);
      if (t.indexOf("/") >= 0) return;                 /* embaralhado: não faz sentido ouvir */
      if (t.length > 3) el.appendChild(botaoAudio(t.replace(/_+/g, " blank "), "Ouvir em inglês"));
    });
    /* alternativas do quiz: o botão do jogo já é <button>, então o som vai ao lado, fora dele */
    raiz.querySelectorAll("button.opt").forEach(function(b){
      if (b.dataset.mlAudio) return; b.dataset.mlAudio = "1";
      var t = b.textContent.trim().replace(/^[a-d]\)\s*/i, "");
      if (t.length < 4) return;
      var s2 = botaoAudio(t, "Ouvir a alternativa");
      s2.style.marginLeft = "4px";
      if (b.parentNode) b.parentNode.insertBefore(s2, b.nextSibling);
    });
  }

  /* textos de leitura: barra no topo + alto-falante por parágrafo */
  raiz.querySelectorAll(".read, .rd, .reading, .txtbox").forEach(function(r){
    if (r.dataset.mlAudio) return; r.dataset.mlAudio = "1";
    var paras = [].slice.call(r.querySelectorAll("p"))
      .filter(function(p){ return p.textContent.trim().length > 25; });
    if (!paras.length) return;
    var barra = document.createElement("div");
    barra.className = "mlRead";
    var tudo = paras.map(function(p){ return p.textContent.trim(); }).join(" ");
    var ouvir = botaoAudio(tudo, "Ouvir o texto inteiro");
    ouvir.innerHTML = "🔊 Ouvir o texto";
    ouvir.className = "mlSpk mlWide";
    var parar = document.createElement("button");
    parar.type = "button"; parar.className = "mlSpk mlWide"; parar.innerHTML = "⏹️ Parar";
    parar.addEventListener("click", function(ev){ ev.stopPropagation(); pararFala(); });
    barra.appendChild(ouvir); barra.appendChild(parar);
    var dica = document.createElement("span");
    dica.className = "mlHint";
    dica.textContent = "ou clique no 🔊 de cada parágrafo";
    barra.appendChild(dica);
    r.insertBefore(barra, r.firstChild);
    paras.forEach(function(p){ p.appendChild(botaoAudio(p.textContent.trim(), "Ouvir este parágrafo")); });
  });
}

/* ---------- 7. rever só os itens errados ---------- */
function chaveDoBloco(el){
  if (el.hasAttribute("data-q")) {
    var ns = el.getAttribute("data-ns");
    return (ns ? ns : "q") + "#" + el.getAttribute("data-q");
  }
  if (el.classList.contains("srow")) return "sort#" + el.getAttribute("data-i");
  return null;
}
function reverErros(){
  var est = atual();
  if (!est || !contaErros(est)) return;
  var alvos = ERROS[est];

  /* quiz final: libera as questões erradas para responder de novo */
  var soQuiz = Object.keys(alvos).every(function(k){ return k.indexOf("quiz#") === 0; });
  if (soQuiz) {
    var n = 0;
    Object.keys(alvos).forEach(function(k){
      var gi = parseInt(k.split("#")[1], 10);
      try { if (qA[gi] !== undefined) { delete qA[gi]; n++; } } catch(e){}
    });
    try { qRender(); } catch(e){}
    aviso("🔁 " + n + " questão(ões) liberada(s) para refazer. Navegue com ◀ ▶.");
    return;
  }

  /* demais estações: reabre e esconde o que já estava certo */
  try { openEp(est); } catch(e){ return; }
  (function(){
    var raiz = scope(), achou = 0;
    var blocos = [].slice.call(raiz.querySelectorAll("[data-q], .srow"));
    blocos.forEach(function(b){
      var k = chaveDoBloco(b);
      if (k && alvos[k]) { b.classList.add("mlAlvo"); achou++; }
      else if (k) b.classList.add("mlOculto");
    });
    if (!achou) { blocos.forEach(function(b){ b.classList.remove("mlOculto"); }); return; }
    var faixa = document.createElement("div");
    faixa.className = "mlFaixa";
    faixa.innerHTML = "🔁 <b>Refazendo " + achou + " item(ns) que você errou.</b> " +
      "<button type='button' class='mlSpk mlWide' id='mlTudo'>Mostrar tudo de novo</button>";
    raiz.insertBefore(faixa, raiz.firstChild);
    var bt = document.getElementById("mlTudo");
    if (bt) bt.addEventListener("click", function(){
      raiz.querySelectorAll(".mlOculto").forEach(function(x){ x.classList.remove("mlOculto"); });
      faixa.remove();
    });
    poeAudio();
    try { window.scrollTo(0, 0); } catch(e){}
  })();
}

function atualizaBotaoErros(){
  var b = document.getElementById("mlErros");
  if (!b) return;
  var n = contaErros(atual());
  b.textContent = n ? "🔁 Rever meus erros (" + n + ")" : "🔁 Rever meus erros";
  b.disabled = !n;
}

/* faixa na tela inicial: progresso salvo, continuar e zerar */
(function(){

  var h = CFG.home ? $$(CFG.home) : null;
  if (!h) return;
  var bar = document.createElement("div");
  bar.className = "mlBar";
  var salvo = lido();
  var txt = !podeGravar

    : (salvo ? "💾 <b>Você já jogou aqui.</b> Progresso guardado: <b>⭐ " + (salvo.s || 0) + "</b>."

  if (podeGravar && salvo) {
    var c = document.createElement("button");
    c.type = "button"; c.className = "mlSpk mlWide"; c.textContent = "▶️ Continuar de onde parei";
    c.addEventListener("click", function(){
      aplicar(salvo);
      ERROS = salvo.erros || {};
      atualizaBotaoErros();
      aviso("▶️ Progresso restaurado: ⭐ " + (salvo.s || 0));
      c.remove();
    });
    bar.appendChild(c);
  }
  if (podeGravar) {
    var z = document.createElement("button");
    z.type = "button"; z.className = "mlSpk mlWide"; z.textContent = "🗑️ Zerar meu progresso";
    z.addEventListener("click", function(){
      apagar(); ERROS = {}; atualizaBotaoErros();
      aviso("🗑️ Progresso apagado deste aparelho. Recarregue a página para começar limpo.");
    });
    bar.appendChild(z);
  }
  h.insertBefore(bar, h.firstChild);
})();

/* põe os alto-falantes no que já estiver na tela */
poeAudio();

/* atalho: S para ouvir de novo a última coisa clicada não é necessário —
   ESC também para a fala, além do que o jogo já faz */
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") pararFala();
});

window.__melhorias = { versao: 1, motor: DIA, fala: TEM_FALA, grava: podeGravar };
})();

</script>
